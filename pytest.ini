[pytest]
markers =
    gpu: needs a CUDA GPU, OpenPCDet, model weights or KITTI data; deselected by default, run with: pytest -m gpu
    e2e: browser tests (tests/e2e, Playwright + Chromium from requirements-dev.txt); deselected by default, run with: pytest -m e2e
    postgres: needs the PostgreSQL of docker-compose.db.yml; deselected by default, run with: pytest -m postgres
    worker: starts real Celery worker processes (needs Redis and PostgreSQL of docker-compose.db.yml); run with: pytest -m worker
addopts = -m "not gpu and not e2e and not postgres and not worker"
