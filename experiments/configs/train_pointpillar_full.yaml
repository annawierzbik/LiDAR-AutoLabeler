# Control for train_pointpillar_clean.yaml: the same setup (1 GPU, batch 4, launcher, seed) on the
# full KITTI object train split. Differs from train_pointpillar_clean.yaml only in the data keys.
experiment_id: E0
seed: 666
name: pointpillar_train_full
cfg_group: kitti_models_clean
base_config: cfgs/kitti_models/pointpillar.yaml
tag: seed666
gpu_poll_s: 2

overrides:
  DATA_CONFIG.DATA_SPLIT: {train: train, test: val}
  DATA_CONFIG.INFO_PATH: {train: [kitti_infos_train.pkl], test: [kitti_infos_val.pkl]}
  DATA_CONFIG.DATA_AUGMENTOR.AUG_CONFIG_LIST.0.DB_INFO_PATH: [kitti_dbinfos_train.pkl]
  DATA_CONFIG.DATA_AUGMENTOR.AUG_CONFIG_LIST.0.USE_ROAD_PLANE: true   # needs training/planes (7481 files)

train:
  batch_size: 4
  workers: 4
  epochs: 80
  ckpt_save_interval: 1
  max_ckpt_save_num: 30
