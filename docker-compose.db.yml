# PostgreSQL, Redis and MinIO for local work and the tests (pytest -m postgres, -m worker, -m s3).
# Not the deployment: that is docker-compose.yml (no default passwords there).
#   docker compose -f docker-compose.db.yml up -d
#   docker compose -f docker-compose.db.yml down          # keeps the data volume (add -v to delete it)
# The passwords are for these local containers only; set LAL_DB_PASSWORD / LAL_MINIO_PASSWORD to
# choose others. MinIO is built from source (deploy/minio/Dockerfile, docs/adr/0019).
# Both ports are bound to 127.0.0.1 only. Redis is the Celery broker (no persistence needed:
# job state lives in the jobs table).
name: lidar-autolabeler-db

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lal
      POSTGRES_PASSWORD: ${LAL_DB_PASSWORD:-lal_local}
      POSTGRES_DB: lal
    ports:
      - "127.0.0.1:55432:5432"        # host port 55432 so a local PostgreSQL on 5432 does not clash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lal -d lal"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"        # host port 56379 so a local Redis on 6379 does not clash
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    build: deploy/minio
    image: lal-minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: lal-local
      MINIO_ROOT_PASSWORD: ${LAL_MINIO_PASSWORD:-lal-local-minio}
    ports:
      - "127.0.0.1:59000:9000"        # S3 API
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
